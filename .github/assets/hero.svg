<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">FableForge - AI-Powered Heirloom Storybook Platform</title>
  <desc id="hero-desc">FableForge transforms family photos into magical, heirloom-quality storybooks using Claude 3.5 Sonnet, Flux.1 Dev, PuLID face consistency, and print fulfillment.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="20" fill="url(#bg-grad)"/>
  <rect width="1198" height="378" x="1" y="1" rx="19" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Background Decorative Grid Lines -->
  <path d="M 0,95 L 1200,95 M 0,190 L 1200,190 M 0,285 L 1200,285" stroke="#292524" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,8"/>
  <path d="M 300,0 L 300,380 M 600,0 L 600,380 M 900,0 L 900,380" stroke="#292524" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,8"/>

  <!-- Left Column: Information & Identity -->
  <g transform="translate(56, 44)">
    <!-- Eyebrow Badge -->
    <rect width="290" height="28" rx="14" fill="#1c1917" stroke="url(#gold-grad)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#fbbf24"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde68a" letter-spacing="1.2">HEIRLOOM TRADITION-AS-A-SERVICE</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#f5f5f4" letter-spacing="-0.5">FableForge</text>
    <text x="245" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="url(#gold-grad)">(Our Story Books)</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#d6d3d1">Transform family photos into magical, AI-illustrated storybooks.</text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#a8a29e">Zero-shot identity preservation, WebGL flipbook &amp; physical gold-foil printing.</text>

    <!-- Key Metrics & Tech Pill Group -->
    <g transform="translate(0, 178)">
      <!-- Tech Badge 1 -->
      <rect width="130" height="34" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
      <text x="14" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#34d399">Claude 3.5</text>

      <!-- Tech Badge 2 -->
      <rect x="138" width="140" height="34" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
      <text x="152" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fbbf24">Flux.1 + PuLID</text>

      <!-- Tech Badge 3 -->
      <rect x="286" width="140" height="34" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
      <text x="300" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6ee7b7">Gelato &amp; Bookvault</text>
    </g>

    <!-- Stat Highlights -->
    <g transform="translate(0, 242)">
      <text x="0" y="20" font-family="Georgia, serif" font-size="24" font-weight="700" fill="url(#gold-grad)">&lt; 15s</text>
      <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#78716c">TIME TO AWE</text>

      <text x="110" y="20" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#f5f5f4">70%</text>
      <text x="110" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#78716c">GROSS MARGIN</text>

      <text x="210" y="20" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#34d399">130+</text>
      <text x="210" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#78716c">PRINT HUBS</text>
    </g>
  </g>

  <!-- Right Column: Visual Pipeline & Book Representation -->
  <g transform="translate(680, 44)">
    <!-- Container Frame -->
    <rect width="464" height="292" rx="14" fill="url(#card-grad)" stroke="#44403c" stroke-width="1"/>

    <!-- Header bar of card -->
    <path d="M 0,14 C 0,6 6,0 14,0 L 450,0 C 458,0 464,6 464,14 L 464,36 L 0,36 Z" fill="#1c1917"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="74" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a8a29e">fableforge-pipeline // end-to-end flow</text>

    <!-- Pipeline Step 1: Input Photo -->
    <g transform="translate(24, 60)">
      <rect width="116" height="90" rx="8" fill="#0c0a09" stroke="#57534e" stroke-width="1"/>
      <circle cx="58" cy="38" r="16" fill="#44403c"/>
      <path d="M 38,68 C 38,54 46,48 58,48 C 70,48 78,54 78,68 Z" fill="#57534e"/>
      <text x="58" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#d6d3d1" text-anchor="middle">Child Photo</text>
    </g>

    <!-- Flow Arrow 1 -->
    <path d="M 148,105 L 172,105" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="172,101 178,105 172,109" fill="#fbbf24"/>

    <!-- Pipeline Step 2: AI Core -->
    <g transform="translate(186, 60)">
      <rect width="124" height="90" rx="8" fill="#0c0a09" stroke="url(#gold-grad)" stroke-width="1.5"/>
      <text x="62" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">AI ENGINE</text>
      <text x="62" y="44" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#34d399" text-anchor="middle">Claude 3.5 Sonnet</text>
      <text x="62" y="58" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#fbbf24" text-anchor="middle">Flux.1 + PuLID</text>
      <text x="62" y="72" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#a8a29e" text-anchor="middle">FaceDetailer</text>
    </g>

    <!-- Flow Arrow 2 -->
    <path d="M 318,105 L 342,105" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="342,101 348,105 342,109" fill="#fbbf24"/>

    <!-- Pipeline Step 3: Heirloom Output -->
    <g transform="translate(356, 60)">
      <rect width="84" height="90" rx="8" fill="#0c0a09" stroke="#047857" stroke-width="1"/>
      <rect x="14" y="16" width="56" height="58" rx="4" fill="#064e3b" stroke="url(#gold-grad)" stroke-width="1"/>
      <!-- Book Gold Foil Stamp graphic -->
      <polygon points="42,28 46,36 54,37 48,43 50,51 42,46 34,51 36,43 30,37 38,36" fill="url(#gold-grad)"/>
      <text x="42" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">Heirloom Book</text>
    </g>

    <!-- Lower Half: Dynamic Feature Badges in Card -->
    <g transform="translate(24, 170)">
      <rect width="416" height="98" rx="8" fill="#0c0a09" stroke="#292524" stroke-width="1"/>

      <!-- Row 1: 3D Flipbook & Vector Foil -->
      <circle cx="20" cy="28" r="4" fill="#fbbf24"/>
      <text x="32" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">3D WebGL Flipbook Preview</text>

      <circle cx="230" cy="28" r="4" fill="#34d399"/>
      <text x="242" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">PDF Vector Foil Stamping</text>

      <!-- Divider line -->
      <line x1="16" y1="52" x2="400" y2="52" stroke="#1c1917" stroke-width="1"/>

      <!-- Row 2: Waterfall Fulfillment & B2B -->
      <circle cx="20" cy="72" r="4" fill="#38bdf8"/>
      <text x="32" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">Waterfall Print Routing</text>

      <circle cx="230" cy="72" r="4" fill="#c084fc"/>
      <text x="242" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">B2B Studio Partner Portal</text>
    </g>
  </g>
</svg>
