<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">FableForge Architecture &amp; AI Fulfillment Pipeline</title>
  <desc id="arch-desc">System architecture diagram showing Storefront, AI Core, Supabase Backend, and Pre-Press Print Fulfillment flow.</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#arch-bg)"/>
  <rect width="1198" height="418" x="1" y="1" rx="19" fill="none" stroke="url(#gold-stroke)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Title Header -->
  <g transform="translate(56, 36)">
    <text x="0" y="24" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f5f5f4">System Architecture &amp; Generation Pipeline</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#a8a29e">From raw photo upload to zero-shot AI generation, vector foil pre-press, and global waterfall fulfillment.</text>
  </g>

  <!-- Grid Layout: 4 Main Pillars -->

  <!-- Pillar 1: Storefront & UX -->
  <g transform="translate(56, 96)">
    <rect width="250" height="280" rx="12" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
    <!-- Header -->
    <path d="M 0,12 C 0,5.4 5.4,0 12,0 L 238,0 C 244.6,0 250,5.4 250,12 L 250,38 L 0,38 Z" fill="#292524"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fde68a">1. STOREFRONT &amp; UX</text>

    <!-- Content Items -->
    <g transform="translate(16, 54)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">React 18 + Vite Storefront</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Tailwind v4 • Framer Motion</text>
    </g>

    <g transform="translate(16, 110)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#fbbf24" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fde68a">WebGL 3D Book Preview</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">react-three-fiber shader</text>
    </g>

    <g transform="translate(16, 166)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#c084fc" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">Memory Jar &amp; B2B Portal</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Photo Vault &amp; Studio Upsell</text>
    </g>

    <g transform="translate(16, 222)">
      <rect width="218" height="42" rx="6" fill="#0c0a09" stroke="#57534e" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#d6d3d1">Story Director Wizard</text>
      <text x="12" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#78716c">Theme &amp; Life Lesson selection</text>
