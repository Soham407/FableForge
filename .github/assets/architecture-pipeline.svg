    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fde68a">2. AI CORE ENGINE</text>

    <!-- Content Items -->
    <g transform="translate(16, 54)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#34d399" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">Claude 3.5 Sonnet</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Narrative Director (JSON Script)</text>
    </g>

    <g transform="translate(16, 110)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#fbbf24" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fde68a">Fal.ai Flux.1 Dev + PuLID</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Zero-Shot Identity Injection</text>
    </g>

    <g transform="translate(16, 166)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#f43f5e" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">FaceDetailer &amp; Upscaler</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Automatic Eye/Expression Fix</text>
    </g>

    <g transform="translate(16, 222)">
      <rect width="218" height="42" rx="6" fill="#0c0a09" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">pgvector RAG Search</text>
      <text x="12" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#78716c">Memory Jar Context Retrieval</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 590,236 L 618,236" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="618,232 624,236 618,240" fill="#fbbf24"/>

