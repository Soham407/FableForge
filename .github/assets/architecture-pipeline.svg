    <g transform="translate(14, 222)">
      <rect width="218" height="42" rx="6" fill="#0c0a09" stroke="#c084fc" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#c084fc">20% B2B Commissions</text>
      <text x="12" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#78716c">Automated revenue share</text>
