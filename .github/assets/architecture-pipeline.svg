      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fde68a">Lemon Squeezy / Stripe</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Merchant of Record Webhooks</text>
    </g>

    <g transform="translate(14, 222)">
      <rect width="212" height="42" rx="6" fill="#0c0a09" stroke="#57534e" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#d6d3d1">Input Sanitization</text>
      <text x="12" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#78716c">Security hardening layer</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 864,236 L 892,236" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="892,232 898,236 892,240" fill="#fbbf24"/>

  <!-- Pillar 4: Pre-Press & Fulfillment -->
  <g transform="translate(898, 96)">
    <rect width="246" height="280" rx="12" fill="#1c1917" stroke="#047857" stroke-width="1"/>
    <!-- Header -->
    <path d="M 0,12 C 0,5.4 5.4,0 12,0 L 234,0 C 240.6,0 246,5.4 246,12 L 246,38 L 0,38 Z" fill="#022c22"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#34d399">4. PRE-PRESS &amp; PRINT</text>

    <!-- Content Items -->
    <g transform="translate(14, 54)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#fbbf24" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fde68a">pdf-lib Pre-Press</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">CMYK Interior + Vector Foil Mask</text>
