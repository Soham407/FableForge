    <g transform="translate(14, 110)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Gelato API Routing</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Standard Tier (130+ local hubs)</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="218" height="46" rx="6" fill="#0c0a09" stroke="#d97706" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">Bookvault API Routing</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Heirloom Leather &amp; Gold Foil</text>
