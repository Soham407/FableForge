    <path d="M 0,12 C 0,5.4 5.4,0 12,0 L 228,0 C 234.6,0 240,5.4 240,12 L 240,38 L 0,38 Z" fill="#064e3b"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">3. BACKEND &amp; DATA</text>

    <!-- Content Items -->
    <g transform="translate(14, 54)">
      <rect width="212" height="46" rx="6" fill="#0c0a09" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Supabase BaaS</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Auth • Database • Storage</text>
    </g>

    <g transform="translate(14, 110)">
      <rect width="212" height="46" rx="6" fill="#0c0a09" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">Edge Functions</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">generate-story / image / pdf</text>
